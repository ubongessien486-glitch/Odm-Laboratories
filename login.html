<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Login | Oxygen Learning Hub</title>
    <meta name="description" content="Login to access premium training and resources.">
    <link rel="stylesheet" href="styles.css?v=3000">
    <style>
        body { background: var(--gray-50); }
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            background: linear-gradient(135deg, var(--navy-dark), var(--navy));
        }
        .auth-card {
            background: var(--white);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            padding: 48px 40px;
            position: relative;
        }
        .auth-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 32px;
        }
        .auth-logo img {
            height: 48px;
            background: var(--navy);
            padding: 8px 12px;
            border-radius: 8px;
        }
        .auth-card h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--navy);
            text-align: center;
            margin-bottom: 8px;
        }
        .auth-card p {
            text-align: center;
            color: var(--gray-600);
            font-size: 14px;
            margin-bottom: 32px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--navy);
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            color: var(--gray-800);
            transition: all 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(249,168,37,0.15);
        }
        .btn-auth {
            width: 100%;
            background: var(--gold);
            color: var(--navy-dark);
            font-weight: 700;
            font-size: 15px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }
        .btn-auth:hover {
            background: #ffd54f;
            transform: translateY(-1px);
        }
        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: var(--gray-600);
        }
        .auth-footer a {
            color: var(--blue);
            font-weight: 600;
        }
        .auth-footer a:hover { text-decoration: underline; }
        #auth-error {
            display: none;
            color: #d32f2f;
            background: #ffebee;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }
        #auth-success {
            display: none;
            color: #2e7d32;
            background: #e8f5e9;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }
        .back-home {
            position: absolute;
            top: 24px;
            left: 24px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }
        .back-home:hover { color: var(--white); }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <a href="index.html" class="back-home">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back to Home
        </a>
        <div class="auth-card">
            <div class="auth-logo">
                <img src="logo.png" alt="Oxygen Group">
            </div>
            <h1 id="auth-title">Member Login</h1>
            <p id="auth-subtitle">Access your premium training and resources.</p>
            
            <div id="auth-error"></div>
            <div id="auth-success"></div>

            <form id="auth-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-auth" id="submit-btn">Sign In</button>
            </form>

            <div class="auth-footer" id="toggle-container">
                Don't have an account? <a href="#" id="toggle-mode">Sign up</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase.js';

        let isLogin = true;
        const form = document.getElementById('auth-form');
        const title = document.getElementById('auth-title');
        const subtitle = document.getElementById('auth-subtitle');
        const submitBtn = document.getElementById('submit-btn');
        const toggleMode = document.getElementById('toggle-mode');
        const toggleContainer = document.getElementById('toggle-container');
        const errorDiv = document.getElementById('auth-error');
        const successDiv = document.getElementById('auth-success');

        async function handleRedirect(email) {
            try {
                const { data: adminRecord } = await supabase
                    .from('admins')
                    .select('email')
                    .eq('email', email)
                    .single();
                
                if (adminRecord) {
                    window.location.replace('admin.html');
                } else {
                    window.location.replace('dashboard.html');
                }
            } catch (err) {
                // If it fails or not single (regular student), go to dashboard
                window.location.replace('dashboard.html');
            }
        }

        // Check if user is already logged in
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            await handleRedirect(session.user.email);
        }

        toggleMode.addEventListener('click', (e) => {
            e.preventDefault();
            isLogin = !isLogin;
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            if (isLogin) {
                title.textContent = 'Member Login';
                subtitle.textContent = 'Access your premium training and resources.';
                submitBtn.textContent = 'Sign In';
                toggleContainer.innerHTML = `Don't have an account? <a href="#" id="toggle-mode">Sign up</a>`;
            } else {
                title.textContent = 'Create Account';
                subtitle.textContent = 'Join the Oxygen Learning Hub.';
                submitBtn.textContent = 'Sign Up';
                toggleContainer.innerHTML = `Already have an account? <a href="#" id="toggle-mode">Sign in</a>`;
            }
            
            // Re-attach listener to new element
            document.getElementById('toggle-mode').addEventListener('click', arguments.callee);
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Please wait...';

            if (isLogin) {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    errorDiv.textContent = error.message;
                    errorDiv.style.display = 'block';
                    submitBtn.textContent = 'Sign In';
                } else {
                    await handleRedirect(email);
                }
            } else {
                const { data, error } = await supabase.auth.signUp({ email, password });
                if (error) {
                    errorDiv.textContent = error.message;
                    errorDiv.style.display = 'block';
                    submitBtn.textContent = 'Sign Up';
                } else {
                    successDiv.textContent = 'Registration successful! If you registered as an admin, you can now sign in.';
                    successDiv.style.display = 'block';
                    form.reset();
                    if (data?.session) {
                        await handleRedirect(email);
                    }
                    submitBtn.textContent = 'Sign Up';
                }
            }
            submitBtn.disabled = false;
        });
    </script>
</body>
</html>
