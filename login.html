<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Oxygen Group</title>
    <meta name="description" content="Authorized admin login for Oxygen Group.">
    <link rel="stylesheet" href="styles.css?v=3104">
    <style>
        body { 
            background: #0f172a;
            margin: 0;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            background: linear-gradient(-45deg, #0f172a, #1e293b, #173966, #285b8f);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            position: relative;
            overflow: hidden;
        }
        .auth-wrapper::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(77,146,171,0.15) 0%, transparent 70%);
            top: -200px;
            left: -100px;
            border-radius: 50%;
        }
        .auth-wrapper::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,196,57,0.1) 0%, transparent 70%);
            bottom: -150px;
            right: -100px;
            border-radius: 50%;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 440px;
            padding: 48px 40px;
            position: relative;
            z-index: 10;
            transform: translateY(0);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .auth-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 32px 70px rgba(0, 0, 0, 0.25);
        }
        .auth-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 32px;
        }
        .auth-logo img {
            height: 48px;
            width: auto;
            max-width: 190px;
            object-fit: contain;
            background: var(--navy);
            padding: 8px 12px;
            border-radius: 8px;
        }
        .auth-card h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--navy);
            text-align: center;
            margin-bottom: 8px;
        }
        .auth-card p {
            text-align: center;
            color: var(--gray-600);
            font-size: 14px;
            margin-bottom: 32px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--navy);
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(23, 57, 102, 0.2);
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            color: #12243f;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02) inset;
        }
        .form-control:focus {
            outline: none;
            border-color: #f9a825;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(249,168,37,0.15), 0 2px 8px rgba(0,0,0,0.02) inset;
            transform: translateY(-1px);
        }
        .btn-auth {
            width: 100%;
            background: linear-gradient(135deg, #f9a825, #fbc02d);
            color: #173966;
            font-weight: 800;
            font-size: 16px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 14px;
            box-shadow: 0 8px 20px rgba(249,168,37,0.25);
            letter-spacing: 0.5px;
        }
        .btn-auth:hover {
            background: linear-gradient(135deg, #fbc02d, #ffeb3b);
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(249,168,37,0.35);
        }
        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: var(--gray-600);
        }
        .auth-footer a {
            color: var(--blue);
            font-weight: 600;
        }
        .auth-footer a:hover { text-decoration: underline; }
        #auth-error {
            display: none;
            color: #d32f2f;
            background: #ffebee;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }
        #auth-success {
            display: none;
            color: #2e7d32;
            background: #e8f5e9;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }
        .back-home {
            position: absolute;
            top: 24px;
            left: 24px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }
        .back-home:hover { color: var(--white); }
    </style>

    <meta property="og:title" content="Admin Login | Oxygen Group">
    <meta property="og:description" content="Authorized admin login for Oxygen Group.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://oxygendx.com/login.html">
    <meta property="og:image" content="https://oxygendx.com/oxygen-group-logo.svg">
    <meta name="twitter:card" content="summary_large_image">
</head>
<body>
    <div class="auth-wrapper">
        <a href="index.html" class="back-home">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back to Home
        </a>
        <div class="auth-card">
            <div class="auth-logo">
                <img loading="eager" decoding="async" alt="Oxygen Group" src="logo-cropped.png">
            </div>
            <h1 id="auth-title">Admin Login</h1>
            <p id="auth-subtitle">Authorized Oxygen Group staff only.</p>
            
            <div id="auth-error"></div>
            <div id="auth-success"></div>

            <form id="auth-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="��������">
                </div>
                <button type="submit" class="btn-auth" id="submit-btn">Sign In</button>
            </form>

            <div class="auth-footer" id="toggle-container">
                Access is managed by the site administrator.
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase.js';

        const form = document.getElementById('auth-form');
        const submitBtn = document.getElementById('submit-btn');
        const errorDiv = document.getElementById('auth-error');
        const successDiv = document.getElementById('auth-success');
        const requestedNext = new URLSearchParams(window.location.search).get('next');
        const nextPage = ['admin.html', 'dashboard.html'].includes(requestedNext) ? requestedNext : null;

        // Check if user is already logged in
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            const { data: adminRecord } = await supabase.from('admins').select('email').eq('email', session.user.email).maybeSingle();
            window.location.href = nextPage || (adminRecord ? 'admin.html' : 'dashboard.html');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Please wait...';

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                errorDiv.textContent = 'Invalid email or password.';
                errorDiv.style.display = 'block';
                submitBtn.textContent = 'Sign In';
                submitBtn.disabled = false;
                return;
            }

            const signedInEmail = data.user.email;
            const { data: adminRecord } = await supabase.from('admins').select('email').eq('email', signedInEmail).maybeSingle();
            window.location.href = nextPage || (adminRecord ? 'admin.html' : 'dashboard.html');
            submitBtn.disabled = false;
        });
    </script>
</body>
</html>
